services:
  app:
    image: node:22.12.0
    container_name: nextjs_app
    user: "0:0"
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm install && npm run build && npm run start"]
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    environment:
      ACME_DOMAIN: ${ACME_DOMAIN:-geotekcollege.ru}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cert:/etc/nginx/certs
      - ./certbot/www:/var/www/certbot:ro
      - ./scripts:/scripts:ro
    command: ["/bin/sh", "/scripts/nginx-entrypoint.sh"]
    depends_on:
      - app
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/nginx/certs/fullchain.pem && test -s /etc/nginx/certs/privkey.pem && openssl x509 -checkend 86400 -noout -in /etc/nginx/certs/fullchain.pem && nginx -t"]
      interval: 1m
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    container_name: certbot_renew
    environment:
      ACME_DOMAIN: ${ACME_DOMAIN:-geotekcollege.ru}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./cert:/etc/nginx/certs
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/certbot-renew.sh"]
    restart: unless-stopped

networks:
  default:
    driver: bridge